services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: docktun-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --metrics 0.0.0.0:2000 --protocol ${TUNNEL_PROTOCOL:-http2} run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cloudflared

  backend:
    build: ./backend
    container_name: docktun-backend
    restart: unless-stopped
    expose:
      - "3001"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./cloudflared:/etc/cloudflared
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_ROOT:-./projects}:/opt/projects
    networks:
      - cloudflared

  frontend:
    build: ./frontend
    container_name: docktun-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - cloudflared

  # ZeroConf mDNS local hostname publisher (Winand/zeroconf-local-hostnames).
  # Advertises <container_name>.local on your local LAN so computers and phones on the same Wi-Fi
  # can access services directly (e.g. http://my-service.local:8080) with zero configuration.
  zeroconf:
    image: winand/zeroconf-local-hostnames:latest
    container_name: docktun-zeroconf
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOMAIN=local
    profiles:
      - mdns
      - all

networks:
  cloudflared:
    name: cloudflared
    driver: bridge
