# DockTun Development / Source Compose File
# Builds DockTun from the local repository Dockerfile.
# For production setups without compiling, use compose.prebuilt.yml instead.
name: docktun

services:
  docktun:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docktun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - "${PORT:-8080}:3001"
    # Do not use long-form env_file (requires newer Compose versions).
    # Compose automatically reads a local .env file for these substitutions,
    # but a fresh installation can start with no .env at all.
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TUNNEL_NAME: ${TUNNEL_NAME:-}
      TUNNEL_ID: ${TUNNEL_ID:-}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      CLOUDFLARED_CONFIG_PATH: ${CLOUDFLARED_CONFIG_PATH:-/etc/cloudflared/config.yml}
      CLOUDFLARED_CONTAINER: ${CLOUDFLARED_CONTAINER:-docktun-cloudflared}
      CLOUDFLARED_METRICS: ${CLOUDFLARED_METRICS:-http://docktun-cloudflared:2000/metrics}
      TAILSCALE_STATE_VOLUME: ${TAILSCALE_STATE_VOLUME:-docktun-tailscale-state}
      TAILSCALE_NETWORK: ${TAILSCALE_NETWORK:-${DOCKER_NETWORK:-docktun}}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-51820}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-docktun}
      DB_PATH: ${DB_PATH:-/app/data/app.db}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:3001}
      SELF_PATH: ${SELF_PATH:-/opt/projects/docktun}
      MESH_MODE: ${MESH_MODE:-none}
      MESH_CONFIG_PATH: ${MESH_CONFIG_PATH:-/etc/docktun/mesh.json}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-}
      CF_TOKEN: ${CF_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CF_ACCOUNT: ${CF_ACCOUNT:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
    volumes:
      - ./data:/app/data
      - ./cloudflared:/etc/cloudflared
      - ./data/wireguard:/app/data/wireguard
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_ROOT:-./projects}:/opt/projects
    networks:
      docktun:
        aliases:
          - docktun
          - docktun-backend
          - docktun-frontend

  # Local ZeroConf mDNS router and portless reverse proxy for *.local
  zeroconf:
    build: ./zeroconf
    container_name: docktun-zeroconf
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOMAIN=local
      - HTTP_PORT=80
      - DOCKTUN_PORT=${PORT:-8080}


networks:
  docktun:
    name: ${DOCKER_NETWORK:-docktun}
    driver: bridge
