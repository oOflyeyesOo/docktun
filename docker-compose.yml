services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: docktun-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --metrics 0.0.0.0:2000 --protocol ${TUNNEL_PROTOCOL:-http2} run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cloudflared

  docktun:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docktun
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:3001"
    expose:
      - "3001"
      - "80"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./cloudflared:/etc/cloudflared
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_ROOT:-./projects}:/opt/projects
    networks:
      cloudflared:
        aliases:
          - docktun
          - docktun-backend
          - docktun-frontend

  # Optional local ZeroConf mDNS router (run with: docker compose --profile zeroconf up -d)
  zeroconf:
    profiles: ["zeroconf"]
    build: ./zeroconf
    container_name: docktun-zeroconf
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOMAIN=local
      - HTTP_PORT=80
      - DOCKTUN_PORT=${PORT:-8080}

networks:
  cloudflared:
    name: cloudflared
    driver: bridge
