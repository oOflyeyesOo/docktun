name: docktun

services:
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: docktun-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --metrics 0.0.0.0:2000 --protocol ${TUNNEL_PROTOCOL:-http2} run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      - net.ipv4.ping_group_range=0 65535
    networks:
      - docktun

  docktun:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docktun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - "${PORT:-8080}:3001"
    # Do not use long-form env_file (requires newer Compose versions).
    # Compose automatically reads a local .env file for these substitutions,
    # but a fresh installation can start with no .env at all.
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TUNNEL_NAME: ${TUNNEL_NAME:-}
      TUNNEL_ID: ${TUNNEL_ID:-}
      CLOUDFLARED_CONFIG_PATH: ${CLOUDFLARED_CONFIG_PATH:-/etc/cloudflared/config.yml}
      CLOUDFLARED_CONTAINER: ${CLOUDFLARED_CONTAINER:-docktun-cloudflared}
      CLOUDFLARED_METRICS: ${CLOUDFLARED_METRICS:-http://docktun-cloudflared:2000/metrics}
      TAILSCALE_STATE_VOLUME: ${TAILSCALE_STATE_VOLUME:-docktun-tailscale-state}
      TAILSCALE_NETWORK: ${TAILSCALE_NETWORK:-${DOCKER_NETWORK:-docktun}}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-docktun}
      DB_PATH: ${DB_PATH:-/app/data/app.db}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:3001}
      SELF_PATH: ${SELF_PATH:-/opt/projects/docktun}
      MESH_MODE: ${MESH_MODE:-none}
      MESH_CONFIG_PATH: ${MESH_CONFIG_PATH:-/etc/docktun/mesh.json}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-}
      CF_TOKEN: ${CF_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CF_ACCOUNT: ${CF_ACCOUNT:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
    volumes:
      - ./data:/app/data
      - ./cloudflared:/etc/cloudflared
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_ROOT:-./projects}:/opt/projects
    networks:
      docktun:
        aliases:
          - docktun
          - docktun-backend
          - docktun-frontend

  # Optional local ZeroConf mDNS router (run with: docker compose --profile zeroconf up -d)
  zeroconf:
    profiles: ["zeroconf", "all"]
    build: ./zeroconf
    container_name: docktun-zeroconf
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOMAIN=local
      - HTTP_PORT=80
      - DOCKTUN_PORT=${PORT:-8080}

  # Optional Tailscale Zero-Trust Mesh VPN (run with: docker compose --profile tailscale up -d)
  tailscale:
    profiles: ["tailscale", "mesh", "all"]
    image: tailscale/tailscale:latest
    container_name: docktun-tailscale
    hostname: docktun
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
    networks:
      - docktun

  # Optional WireGuard Point-to-Point VPN Tunnel (run with: docker compose --profile wireguard up -d)
  wireguard:
    profiles: ["wireguard", "mesh", "all"]
    image: linuxserver/wireguard:latest
    container_name: docktun-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVERURL=${WIREGUARD_SERVERURL:-auto}
      - SERVERPORT=51820
      - PEERS=${WIREGUARD_PEERS:-3}
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
    volumes:
      - ./data/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WIREGUARD_PORT:-51820}:51820/udp"
    networks:
      - docktun

volumes:
  tailscale-state:
    name: ${TAILSCALE_STATE_VOLUME:-docktun-tailscale-state}

networks:
  docktun:
    name: ${DOCKER_NETWORK:-docktun}
    driver: bridge
