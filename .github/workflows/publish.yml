name: Publish DockTun container image

# Only publish after the existing Validate workflow passes on main.
# A manual dispatch is available to rebuild an already-reviewed commit.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: docktun-ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful validation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$revision&status=success" --jq '.workflow_runs | any(.head_sha == "'"$revision"'" and .event == "push")' | grep -qx true

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ooflyeyesoo/docktun:edge
            ghcr.io/ooflyeyesoo/docktun:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.title=DockTun
            org.opencontainers.image.description=Self-hosted Docker management and secure tunnel dashboard
            org.opencontainers.image.source=https://github.com/oOflyeyesOo/docktun
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan before signing the edge artifact
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/ooflyeyesoo/docktun@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.1.4
      - name: Sign validated and scanned edge digest
        env:
          IMAGE: ghcr.io/ooflyeyesoo/docktun@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
