name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go build ./cmd/server
        working-directory: backend
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm run build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKTUN_TEST_IMAGE: docktun:test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: python3 tests/verify_compose_install.py
      - run: python3 tests/verify_prebuilt_install.py
      - run: python3 tests/release_installer_test.py
      - run: docker build -t docktun:test .
      - name: Scan the local candidate before merge
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: docktun:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - run: python3 tests/container_smoke.py
      - run: python3 tests/prebuilt_install_integration.py
      - run: python3 tests/auth_restore_integration.py
      - run: python3 tests/recovery_integration.py
      - run: python3 tests/compose_integration.py
      - run: python3 tests/application_update_integration.py
      - run: python3 tests/transfers_update_integration.py
      - run: python3 tests/service_updates_integration.py
