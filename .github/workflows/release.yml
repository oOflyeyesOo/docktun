name: Reviewed release
on:
  release:
    types: [published]
permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
concurrency:
  group: docktun-reviewed-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKTUN_TEST_IMAGE: docktun:release-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release identity and exact source checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          revision=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$revision&status=success" --jq '.workflow_runs | any(.head_sha == "'"$revision"'" and .event == "push")' | grep -qx true
          echo "REVISION=$revision" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact source for destructive fixture tests
        run: docker build -t "$DOCKTUN_TEST_IMAGE" .
      - run: python3 tests/historical_upgrade_integration.py
      - run: python3 tests/recovery_integration.py
      - run: python3 tests/application_update_integration.py
      - run: python3 tests/service_updates_integration.py
      - name: Refuse to overwrite an existing release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/ooflyeyesoo/docktun:$TAG" > version-check.log 2>&1; then
            echo "Version already exists. Use a new reviewed release tag."; exit 1
          else
            grep -Eq 'manifest unknown|not found' version-check.log || { cat version-check.log; exit 1; }
          fi
      - name: Publish versioned artifact before channel promotion
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ooflyeyesoo/docktun:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/oOflyeyesOo/docktun
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          provenance: mode=max
          sbom: true
      - name: Scan linux/amd64 image before signing
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/ooflyeyesoo/docktun@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan linux/arm64 image before signing
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/ooflyeyesoo/docktun@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign, verify, and generate immutable installer
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/ooflyeyesoo/docktun@$DIGEST"
          cosign sign --yes "$image"
          cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image"
          python3 scripts/release_installer.py --digest "$DIGEST" --version "$TAG" --revision "$REVISION"
          docker compose -f release-assets/compose.yml config --quiet
          cosign sign-blob --yes --bundle release-assets/compose.sigstore.json release-assets/compose.yml
      - name: Test the actual release installer in an empty engine
        env:
          DOCKTUN_INSTALLER: release-assets/compose.yml
        run: python3 tests/prebuilt_install_integration.py
      - name: Attach reviewed installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-assets/*
      - name: Promote only the verified immutable artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            docker buildx imagetools create -t ghcr.io/ooflyeyesoo/docktun:beta "ghcr.io/ooflyeyesoo/docktun@$DIGEST"
          else
            docker buildx imagetools create -t ghcr.io/ooflyeyesoo/docktun:latest -t ghcr.io/ooflyeyesoo/docktun:stable "ghcr.io/ooflyeyesoo/docktun@$DIGEST"
          fi
